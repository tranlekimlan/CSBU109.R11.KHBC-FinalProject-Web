<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QFix QSVN</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .split-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* NỬA TRÁI: Khu vực Form Đăng nhập (Chiếm 40%) */
        .login-panel {
            width: 40%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
            position: relative;
            z-index: 2;
            box-shadow: 10px 0 30px rgba(0,0,0,0.05);
        }

        /* CSS cho nút Quay lại */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 24px;
            transition: all 0.3s ease;
            width: fit-content;
        }

        .back-link:hover {
            color: #0f766e;
            transform: translateX(-4px); /* Hiệu ứng nhích nhẹ sang trái rất tinh tế */
        }

        /* Logo góc trên */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f766e;
            text-decoration: none;
            width: fit-content;
        }

        .logo-img {
            height: 35px;
            width: auto;
            object-fit: contain;
        }

        .logo-text h1 {
            font-size: 22px;
            font-weight: 800;
            line-height: 1;
        }

        .logo-text p {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* Container chứa nội dung form căn giữa */
        .form-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 400px;
            width: 100%;
            margin: 0 auto; /* Căn giữa form trong panel */
        }

        .form-container h2 {
            font-size: 32px;
            color: #1e293b;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .form-container p.subtitle {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 32px;
        }

        /* Các ô nhập liệu */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            color: #1e293b;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }

        .input-group input:focus {
            outline: none;
            border-color: #14b8a6;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(20, 184, 166, 0.1);
        }

        /* Tùy chọn Ghi nhớ & Quên mật khẩu */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
        }

        .remember-me input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #0f766e;
        }

        .forgot-password {
            font-size: 14px;
            color: #0f766e;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #115e59;
            text-decoration: underline;
        }

        /* Nút Đăng nhập */
        .btn-submit {
            width: 100%;
            background-color: #0f766e;
            color: white;
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #115e59;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(15, 118, 110, 0.3);
        }

        /* Nút chuyển sang Đăng ký */
        .register-link {
            text-align: center;
            margin-top: 32px;
            font-size: 15px;
            color: #64748b;
        }

        .register-link a {
            color: #0f766e;
            font-weight: 700;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* NỬA PHẢI: Khu vực Hình ảnh (Chiếm 60%) */
        .image-panel {
            width: 60%;
            background-image: url('Welcome.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Lớp phủ mờ nhẹ cho ảnh để không quá chói */
        .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.1) 100%);
        }

        /* Responsive cho điện thoại */
        @media (max-width: 900px) {
            .split-layout {
                flex-direction: column-reverse;
            }
            .login-panel {
                width: 100%;
                height: 70%;
                padding: 30px;
                border-top-left-radius: 20px;
                border-top-right-radius: 20px;
                margin-top: -20px; /* Tạo hiệu ứng panel đè lên ảnh */
            }
            .image-panel {
                width: 100%;
                height: 35%;
            }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        
        <!-- Nửa Trái: Form Đăng nhập -->
        <div class="login-panel">

            <a href="welcome.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Quay lại
            </a>
            
            <!-- Logo (Bấm vào để quay về Welcome) -->
            <a href="welcome.html" class="logo-container">
                <!-- Đổi đường dẫn logo.png thành file của bạn nếu cần -->
                <img src="logo.png" alt="Logo QFix" class="logo-img" onerror="this.outerHTML='<i class=\'fa-solid fa-wrench logo-icon\' style=\'font-size: 28px; color: #14b8a6;\'></i>'">
                <div class="logo-text">
                    <h1>QFix</h1>
                    <p>QSVN</p>
                </div>
            </a>

            <!-- Nội dung Form -->
            <div class="form-container">
                <h2>Đăng nhập</h2>
                <p class="subtitle">Vui lòng nhập tài khoản để truy cập hệ thống.</p>
                
                <form action="#" method="POST">
                    <div class="input-group">
                        <label for="student_id">Mã Sinh Viên / Tên đăng nhập</label>
                        <input type="text" id="student_id" name="student_id" placeholder="VD: 20231234" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Mật khẩu</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            Ghi nhớ tài khoản
                        </label>
                        <a href="#" class="forgot-password">Quên mật khẩu?</a>
                    </div>

                    <!-- Nút đăng nhập giả lập chuyển sang trang Admin Dashboard bạn đưa lúc trước -->
                    <button type="submit" class="btn-submit" onclick="window.location.href='index.html'; return false;">
                        Đăng nhập vào hệ thống
                    </button>
                </form>

                <div class="register-link">
                    Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
                </div>
            </div>

        </div>

        <!-- Nửa Phải: Ảnh nền -->
        <div class="image-panel">
            <div class="image-overlay"></div>
        </div>

    </div>

</body>
</html>
