<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to QFix - QSVN</title>
    
    <!-- Link Font chữ cơ bản từ Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Link FontAwesome để dùng icon cờ lê -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* 1. Xóa lề mặc định của trình duyệt */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* 2. Thiết lập ảnh nền toàn màn hình */
        body {
            /* Thay ảnh nền tòa nhà ở đây */
            background-image: url('Welcome.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            position: relative;
            overflow: hidden; /* Chống cuộn trang */
        }

        /* 3. Lớp phủ màu đen mờ giúp chữ dễ đọc hơn trên nền ảnh sáng */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); /* Đen mờ 40% */
            z-index: 1;
        }

        /* 4. Thanh điều hướng (Header) */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            z-index: 10; /* Nổi lên trên lớp overlay */
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
            cursor: pointer;
        }

        .logo-icon {
            font-size: 32px;
            color: #2dd4bf; /* Màu xanh ngọc */
        }

        .logo-text h1 {
            font-size: 24px;
            line-height: 1;
        }

        .logo-text p {
            font-size: 12px;
            color: #5eead4;
            letter-spacing: 2px; /* Khoảng cách chữ Q S V N */
        }

        .auth-buttons button {
            cursor: pointer;
            border: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-login {
            background: transparent;
            color: #ffffff;
            padding: 10px 20px;
        }

        .btn-login:hover {
            color: #5eead4;
        }

        .btn-register {
            background-color: #0d9488;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            margin-left: 10px;
        }

        .btn-register:hover {
            background-color: #0f766e;
        }

        /* 5. Căn giữa khung Kính mờ (Glassmorphism) */
        main {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 0 20px;
        }

        /* 6. Hiệu ứng Box Kính mờ */
        .glass-box {
            background: rgba(255, 255, 255, 0.1); /* Nền trắng trong suốt 15% */
            backdrop-filter: blur(5px); /* Lệnh quan trọng nhất: làm mờ ảnh phía sau */
            -webkit-backdrop-filter: blur(5px); /* Hỗ trợ cho Safari */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Viền mờ */
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); /* Bóng đổ cho box */
        }

        .glass-box h2 {
            font-size: 42px;
            color: #ffffff;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); /* Đổ bóng nhẹ cho chữ */
        }

        .glass-box p {
            font-size: 18px;
            color: #f1f5f9;
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .btn-go-home {
            background-color: #ffffff;
            color: #0f766e;
            font-size: 18px;
            font-weight: 800;
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-go-home:hover {
            transform: translateY(-3px); /* Hiệu ứng nhích lên khi di chuột */
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .btn-go-home i {
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <!-- Lớp phủ mờ -->
    <div class="overlay"></div>

    <!-- Header chứa Logo và nút Đăng nhập -->
    <header>
        <div class="logo-container">
            <i class="fa-solid fa-wrench logo-icon"></i>
            <div class="logo-text">
                <h1>QFix</h1>
                <p>QSVN</p>
            </div>
        </div>

        <div class="auth-buttons">
            <button class="btn-login">Đăng nhập</button>
            <button class="btn-register">Đăng ký</button>
        </div>
    </header>

    <!-- Khung nội dung chính giữa màn hình -->
    <main>
        <div class="glass-box">
            <h2>Chào mừng đến với QFix</h2>
            <p>Giải pháp thông minh, nhanh chóng và tiện lợi.</p>
            <p>BÁO NHANH - SỬA NHANH</p>
            
            <button class="btn-go-home">
                Đi đến trang chủ 
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </main>

</body>
</html>
